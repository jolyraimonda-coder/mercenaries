# Builds mods/nuclear_strike.c into mods/nuclear_strike.dll with MSVC x64.
# The artifact appears on the run page under "Artifacts" (nuclear-strike-dll).
name: Build Nuclear Strike DLL

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/nuclear_strike.c'
      - 'mods/mercenaries_mod.h'
      - 'mods/mercfx.h'
      - '.github/workflows/build-nuclear-strike.yml'

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build DLL
        shell: cmd
        working-directory: mods
        run: |
          cl /nologo /W4 /O2 /MT /LD nuclear_strike.c /I . /Fe:nuclear_strike.dll /link /MACHINE:X64 kernel32.lib libucrt.lib libvcruntime.lib

      - name: Check exports
        shell: cmd
        working-directory: mods
        run: dumpbin /exports nuclear_strike.dll | findstr /C:"mercenaries_mod_entry"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuclear-strike-dll
          path: mods/nuclear_strike.dll
          if-no-files-found: error
