name: build-nuke-bomber

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build (MSVC x64)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cd mods
          cl /nologo /W4 /O2 /MT /LD nuke_bomber.c /I . /Fe:nuke_bomber.dll /link /MACHINE:X64 kernel32.lib libucrt.lib libvcruntime.lib
          dumpbin /exports nuke_bomber.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: nuke-bomber-dll
          path: mods/nuke_bomber.dll
