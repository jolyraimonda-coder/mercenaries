# Builds mods/m2_nuke.c into mods/m2_nuke.dll with MSVC x64.
# The artifact appears on the run page under "Artifacts" (m2-nuke-dll).
name: Build Merc 2 Nuke DLL

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/m2_nuke.c'
      - 'mods/mercenaries_mod.h'
      - 'mods/mercfx.h'
      - '.github/workflows/build-m2-nuke.yml'

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build DLL
        shell: cmd
        working-directory: mods
        run: |
          cl /nologo /W4 /O2 /MT /LD m2_nuke.c /I . /Fe:m2_nuke.dll /link /MACHINE:X64 kernel32.lib libucrt.lib libvcruntime.lib

      - name: Check exports
        shell: cmd
        working-directory: mods
        run: dumpbin /exports m2_nuke.dll | findstr /C:"mercenaries_mod_entry"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: m2-nuke-dll
          path: mods/m2_nuke.dll
          if-no-files-found: error
