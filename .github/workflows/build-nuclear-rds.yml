# Builds mods/nuclear_rds.c into mods/nuclear_rds.dll with MSVC x64.
# The artifact appears on the run page under "Artifacts" (nuclear-rds-dll).
name: Build Nuclear RDS DLL

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/nuclear_rds.c'
      - 'mods/mercenaries_mod.h'
      - 'mods/mercfx.h'
      - '.github/workflows/build-nuclear-rds.yml'

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build DLL
        shell: cmd
        working-directory: mods
        run: |
          cl /nologo /W4 /O2 /MT /LD nuclear_rds.c /I . /Fe:nuclear_rds.dll /link /MACHINE:X64 kernel32.lib libucrt.lib libvcruntime.lib

      - name: Check exports
        shell: cmd
        working-directory: mods
        run: dumpbin /exports nuclear_rds.dll | findstr /C:"mercenaries_mod_entry"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuclear-rds-dll
          path: mods/nuclear_rds.dll
          if-no-files-found: error
