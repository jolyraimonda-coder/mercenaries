; Total Warfare Overhaul - Mod Manager settings
; File: mods\total_warfare.ini (kept with player mod settings by the loader)
; Values are indices into each setting's choices shown in MODS.
;
; 0/1 toggles: 0 = OFF, 1 = ON
; BunkerBuster:  0 OFF, 1 HEAVY, 2 NUKE
; NukeEffect:    0 CLASSIC blast, 1 MELTDOWN (retail meltdown explosion as the primary nuke look)
; CruiseFOAB:    0 OFF, 1 HEAVY, 2 THERMO, 3 FOAB
; StrategicNuke: 0 OFF, 1 ON, 2 TSAR (60s mushroom), 3 MEGA (120s + city blanket + radiation haze)
; C4Mega:        0 OFF, 1 MEGA, 2 MEGA 1KM, 3 MEGA 2KM
; Earthquake:    0 OFF, 1 STRONG (10s rolling), 2 EXTREME (20s violent)
; NukeAudio:     0 OFF, 1 LAYERED (cue + built-in), 2 NUKE ONLY
; WaveDemo:      0 OFF, 1 ON (grey wave demolishes buildings as it passes)
; ViewRange:     128-4096, how far the nuke cloud/mushroom renders (4096 = max; lower it if FPS drops)
; ShopProfile:   0 OFF, 1 ON, 2 MAX
;
; Note: This DLL mod provides profile selection, logging, string registration,
; and best-effort shop hooks. True nuclear/thermobaric visuals, map merging,
; flyable custom vehicles, jetpack/parachute physics, and weapon/C4 runtime
; changes require compatible native-effects mods, runtime hooks, or game-data mods.

[TotalWarfare]
Master=1
SmartBomb=1
SurgicalStrike=1
CarpetBomb=1
BunkerBuster=2
CruiseFOAB=3
StrategicNuke=3
C4Mega=3
WeaponRealism=1
Earthquake=2
NukeAudio=2
WaveDemo=1
ViewRange=4096
ShopProfile=2
DebugLog=0
